lifeops:
  services:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
    ai-service-url: ${AI_SERVICE_URL:http://localhost:8082}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://localhost:8083}
    task-service-url: ${TASK_SERVICE_URL:http://localhost:8084}
    truth-service-url: ${TRUTH_SERVICE_URL:http://localhost:8085}

# Google OAuth
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

spring:
  application:
    name: api-gateway

# OAuth2 Resource Server - Google ID Token Validation
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com


  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${lifeops.services.user-service-url}
              predicates:
                - Path=/api/users/**
            - id: ai-service
              uri: ${lifeops.services.ai-service-url}
              predicates:
                - Path=/api/ai/**
            - id: document-service
              uri: ${lifeops.services.document-service-url}
              predicates:
                - Path=/api/documents/**
            - id: task-service
              uri: ${lifeops.services.task-service-url}
              predicates:
                - Path=/api/tasks/**
            - id: truth-service
              uri: ${lifeops.services.truth-service-url}
              predicates:
                - Path=/api/truth/**

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG